name: CI

# Everything else in docs/production-readiness.md degrades silently without
# this, which is why it is first on that list.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm test

      # The real Vite build. A green typecheck over source says nothing about
      # whether Rollup can resolve it — that is exactly how a missing
      # @papa/design dist/ slipped through locally.
      - run: npm run build:app

      # The SAME script developers run, rather than a parallel CI-only
      # implementation.
      #
      # The first version of this workflow used a `services:` Postgres and
      # apt-installed pgTAP on the RUNNER — where the database server cannot
      # see the extension files, because it is in a different container. Two
      # divergent paths, and only one of them was ever exercised.
      #
      # run-tests.sh auto-detects podman or docker, so it works unchanged in
      # both places and cannot drift from what is tested locally.
      - name: Migrations and pgTAP
        run: ./db/run-tests.sh
