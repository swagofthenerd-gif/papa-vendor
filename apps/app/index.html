<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so the scan screen can use the full height on a
         notched phone; the shell pads with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Papa Vendor</title>
    <script>
      // Theme before first paint, or the warehouse gets a white flash in a
      // dark van at 05:00. Three themes: indoor (default), dark (truck), sun.
      // The ledger-paper light theme is the app's face — owner's decision
      // 2026-09-10 — so the OS dark preference no longer overrides it.
      // Dark (the carbon copy) and sun remain one tap away in the header.
      try {
        var saved = localStorage.getItem('papa-theme')
        if (saved) document.documentElement.setAttribute('data-theme', saved)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
